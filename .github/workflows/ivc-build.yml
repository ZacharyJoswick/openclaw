name: IVC Custom Build

on:
  push:
    branches: [ivc/custom-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify IVC provider in dist
        run: |
          grep -r "IvcProvider" dist/ | head -3
          grep -r '"ivc"' dist/ | grep -v node_modules | head -3
          echo "IVC provider verified in dist"

      - name: Package dist
        run: |
          tar czf openclaw-ivc-build.tar.gz \
            dist/ \
            extensions/ \
            dist-runtime/ \
            package.json \
            openclaw.mjs
          ls -lh openclaw-ivc-build.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-ivc-${{ github.sha }}
          path: openclaw-ivc-build.tar.gz
          retention-days: 30
